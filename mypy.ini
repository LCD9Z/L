# mypy.ini — AI股神团队 1.0 类型检查配置
#
# 用法：mypy . --config-file mypy.ini
#
# 覆盖范围：**全部源文件，零错误，无任何 ignore_errors 例外。**
# 1.0 起类型检查已覆盖 agents* / orchestrator / main / prompt_engine /
# stage2_ablation / report_generator 等此前挂起的模块。
#
# 收紧历程：
#   · 1.0      — 启用 check_untyped_defs（未标注函数体也会检查）
#   · 本次收紧 — 启用 strict_optional / no_implicit_optional
#                （修复 22 处 `def f(x: str = None)` 之类的隐式 Optional 标注）
#   · 保留待办 — disallow_untyped_defs 仍为 False：当前开启会产生 569 处
#                「函数缺少类型标注」告警，属纯标注补全、无缺陷捕获收益，
#                留待功能稳定后再推进。
#
# 注意：ini 值后面不能跟行内注释，否则 mypy 会报 "Not a boolean" 并忽略该项。

[mypy]
python_version = 3.10
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = False

# --- 收紧项 ---

# 检查未标注函数体（1.0 起已启用；此前为 False）
check_untyped_defs = True
# 严格 Optional：禁止把 None 隐式赋给非 Optional 类型（本次收紧；此前为 False）
# 该开关捕获的是真实缺陷——`def f(x: str = None)` 在运行时会静默接受 None，
# 调用方一旦按标注传值，下游就会出现 AttributeError/TypeError。
strict_optional = True
no_implicit_optional = True

# --- 仍保持宽松的项（渐进式收紧的余量）---

# 不强制所有函数带标注（开启会产生 569 处告警，纯标注补全，收益递减）
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_decorators = False
warn_return_any = False

show_error_codes = True
show_column_numbers = True
pretty = True
cache_dir = .mypy_cache

# 模块搜索路径。`scripts/` 需要显式加入 —— 它是**脚本目录而非包**
# （无 __init__.py），但 `tests/test_pit_snapshot_scripts.py` 要 import 其模块
# 做纯函数守卫。不加会让 mypy 报 import-not-found，并把被导入符号推成 Any
# （静默失去类型检查）。`.` 保留在首位以维持根目录模块（如 run_ci）的解析。
mypy_path = .:scripts

# 排除模式必须**按路径段匹配**。
# 此前写成 (?x)(__pycache__|\.mypy_cache|\.pytest_cache|build|dist)，
# 而未锚定的 `build` 会匹配到任意位置——`build_tdx_dataset.py` 与
# `pit_universe_builder.py` 因此被静默排除在类型检查之外（186 vs 188）。
# 现要求片段前后是路径分隔符或行首行尾，只排除同名目录。
exclude = (?x)(
    (^|/)(__pycache__|\.mypy_cache|\.pytest_cache|\.ruff_cache|build|dist)(/|$)
  | (^|/)docs/external/
  )

# ---------------------------------------------------------------------------
# 可选依赖：未安装时 stub 缺失不报错
# （这些不是本项目代码，仅抑制"找不到模块"）
# ---------------------------------------------------------------------------

[mypy-crawl4ai.*]
ignore_missing_imports = True

[mypy-tushare.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True

# pytdx：tdx_native 的**可选**依赖（仅 fetch_names / gbbq_reader 的解密路径用）。
# 主路径刻意零依赖（缓存后用标准库读），未安装时不应让类型检查整体失败。
[mypy-pytdx.*]
ignore_missing_imports = True

# akshare：可选数据源（`fetch/akshare_source.py` 惰性导入，未安装时诚实失败）。
# 不安装也不影响核心零依赖路径，故缺 stub 不报错。
[mypy-akshare.*]
ignore_missing_imports = True

# baostock：PIT 快照采集的**可选**依赖（`scripts/run_pit_snapshot_ingest.py`
# 惰性导入，未安装时抛 RuntimeError 并给出安装指引）。
# 它提供本项目此前唯一缺失的「退市日」零鉴权源（见 PIT_SNAPSHOT_DESIGN.md P0）。
# 无类型 stub，且未安装不应让类型检查整体失败 —— 与本文件 pytdx/akshare 同约定。
[mypy-baostock.*]
ignore_missing_imports = True

# xlrd：PIT 快照 L2（申万行业变迁史 xls）的**可选**依赖
# （`scripts/run_pit_snapshot_ingest.py` 惰性导入）。
# 选它而非 pandas：项目当前**无任何 pandas 依赖**（见下方 numpy 节注释），
# 且 xlrd 专为 .xls 设计，正好匹配申万给出的格式。
[mypy-xlrd.*]
ignore_missing_imports = True

# 注：曾有 [mypy-pandas.*] 一节。pandas 现仅通过 pytest.importorskip("pandas")
# 以字符串方式引入，代码库中已无 `import pandas`，该节成为无用配置，
# 已被 warn_unused_configs 报出并移除。


# ---------------------------------------------------------------------------
# numpy：本项目**从不 import numpy**（仅在 docstring 里声明"不依赖 numpy"）。
# 但隔离 venv 中的 numpy 2.5.3 stub 使用了 Python 3.12+ 的 `type` 语句，
# 在 python_version = 3.10 下会被解析为语法错误，并**中断整个检查**
# （"errors prevented further checking"）。
# 故显式跳过跟随 —— 既不掩盖真实问题（无人 import），也避免本地/远端
# 因 numpy 版本差异而出现不一致的门禁结果。
# ---------------------------------------------------------------------------

[mypy-numpy.*]
follow_imports = skip
follow_imports_for_stubs = True
ignore_missing_imports = True

