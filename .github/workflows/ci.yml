name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# 本地等价执行：`python run_ci.py`（脚本按相同顺序跑同一套命令）。
# 修改本工作流时请同步更新 run_ci.py 的 STEPS，二者有 test_run_ci.py 守护一致性。
#
# 测试全程不依赖网络与真实凭据：
# - 数据源限流器在测试中以 FETCH_RATE_PER_SEC=0 关闭，避免拖慢用例
# - 飞书/LLM 凭据一律留空，相关模块走降级分支
env:
  FETCH_RATE_PER_SEC: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  LOG_LEVEL: "WARNING"

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (all sources)
        run: |
          python - <<'PY'
          import glob, py_compile, sys
          bad = []
          for f in sorted(glob.glob("*.py")):
              try:
                  py_compile.compile(f, doraise=True)
              except Exception as e:
                  bad.append((f, e))
          for f, e in bad:
              print(f"FAIL {f}: {e}")
          sys.exit(1 if bad else 0)
          PY

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Mypy type check
        run: mypy . --config-file mypy.ini

      - name: Python 3.10 syntax compatibility guard
        run: pytest test_python_compat.py -q

      - name: Pytest
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml -q

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  security-scan:
    name: credential scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 与本地 `python run_ci.py` 共用同一实现（零依赖，无需 pip install）。
      # 相比此前的内联文本匹配，覆盖面扩展到 *.yml / *.yaml / *.toml / *.ini / *.sh，
      # 并同时检查「敏感变量被赋予非占位值」与「已知泄漏字面量」两类问题。
      # 扫描器自身有单测（test_credential_scan.py），含仓库自检用例。
      - name: Scan for plaintext credentials
        run: python credential_scan.py
